<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Wobble Play</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-first column with a fixed bottom tab bar; white panels on a pale sky ground, tangerine reserved for actions and progress. */
:root{
  --bg:#EEF3FB; --surface:#FFFFFF; --ink:#14224A; --muted:#5B6788; --line:#D5DEEF;
  --accent:#F2552C; --accent-ink:#FFFFFF; --sun:#FFC53D; --teal:#1E9E8A; --tint:#FFE9E1; --good:#DDF3EE;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1730; --surface:#1A2444; --ink:#EEF2FF; --muted:#A3AED0; --line:#2C3963;
  --accent:#FF7A54; --accent-ink:#1A0E08; --sun:#FFC53D; --teal:#4FD1BC; --tint:#3A2320; --good:#173A3A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1730; --surface:#1A2444; --ink:#EEF2FF; --muted:#A3AED0; --line:#2C3963;
  --accent:#FF7A54; --accent-ink:#1A0E08; --sun:#FFC53D; --teal:#4FD1BC; --tint:#3A2320; --good:#173A3A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.45rem;font-weight:600} h3{font-size:1.1rem;font-weight:600}
p{margin:0} ol,ul{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.3rem}
.brand svg{width:28px;height:28px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head.mid{justify-content:center}
.who-chip{font-weight:700;font-size:.85rem;color:var(--muted)}

.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.back{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.back:hover{background:var(--line)}
.eyebrow{font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .3s ease}

.stage{display:flex;flex-direction:column;gap:16px}
.stage.enter{animation:in .25s ease both}
@keyframes in{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.center{text-align:center}
.lede{color:var(--muted);font-size:1.02rem}
.hint{color:var(--muted);font-size:.92rem}
.statement{background:var(--surface);border-radius:var(--r);padding:22px 20px;font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.25;text-align:center;border:2px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:15px 16px;font-weight:600;min-height:56px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--accent);background:var(--tint)}
.opt .em{font-size:1.4rem;line-height:1}
.opt .box{margin-left:auto;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.opt[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt[aria-checked="true"] .box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translateY(-1px)}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.who .card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 6px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden;font-weight:700}
.who .card:hover{border-color:var(--accent)}
.who .card svg{width:100%;max-width:92px;height:auto}
.who .card span{display:block;width:calc(100% + 12px);background:var(--ink);color:var(--bg);padding:9px 4px;font-size:.95rem;text-align:center}

.cta{border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:1.05rem;border-radius:999px;padding:14px 22px;width:100%}
.cta:hover{filter:brightness(1.06)}
.cta:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ghost{border:0;background:transparent;color:var(--muted);font-weight:600;text-decoration:underline;padding:8px;align-self:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pic{align-self:center;width:150px;height:auto}
.field{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:15px 16px}
.field:focus{border-color:var(--accent);outline:none}
.lab{font-weight:700;font-size:.9rem}
.fine{font-size:.82rem;color:var(--muted)}
.tag{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.meta{color:var(--muted);font-size:.9rem;font-weight:600}

.meter{height:12px;border-radius:12px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:12px}
.checks{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:600}
.checks li::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.checks li.done{color:var(--ink)} .checks li.done::before{background:var(--teal);border-color:var(--teal)}

.areas{display:flex;flex-direction:column;gap:12px}
.area{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.area small{color:var(--muted);font-weight:600}
.area .track{grid-column:1/-1;height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.area .track i{display:block;height:100%;border-radius:10px;background:var(--accent)}

.item{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;min-width:0}
.item.done{background:var(--good)}
.item h3{display:flex;gap:8px;align-items:center}
.tick{flex:none;width:22px;height:22px;border-radius:50%;background:var(--teal);display:inline-grid;place-items:center}
.tick::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:rotate(-45deg) translateY(-1px)}
button.item{text-align:left;width:100%}
button.item:hover{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:44px;font-weight:700;font-size:.85rem}
.prep{font-size:.85rem;font-weight:700;color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.vary{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.clock{font-family:var(--display);font-weight:700;font-size:2.2rem;font-variant-numeric:tabular-nums;text-align:center}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;font-weight:700;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{aspect-ratio:1;border-radius:12px;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day.hit{background:var(--teal);color:var(--surface)}
.day.now{outline:3px solid var(--accent);outline-offset:1px}
.warn{background:var(--tint);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);z-index:5;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs a{text-align:center;text-decoration:none;color:var(--muted);font-weight:700;font-size:.88rem;padding:10px 4px;border-radius:12px}
.tabs a[aria-current="page"]{background:var(--tint);color:var(--accent)}

/* on-screen games */
.gbox{display:flex;flex-direction:column;gap:14px;align-items:center}
.gmsg{font-weight:700;min-height:1.5em;text-align:center}
.grid{display:grid;gap:8px;width:100%;max-width:380px}
.cardb{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--ink);color:var(--bg);font-size:1.8rem;display:grid;place-items:center;padding:0}
.cardb.up{background:var(--surface);color:var(--ink)}
.cardb.ok{background:var(--good);border-color:var(--teal)}
.big{width:210px;height:210px;max-width:70vw;max-height:70vw;border-radius:50%;border:4px solid var(--line);background:var(--surface);font-size:5.5rem;display:grid;place-items:center;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pad{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:0;touch-action:manipulation}
.pad.lit{background:var(--sun);border-color:var(--sun)}
.star{font-size:6rem;filter:grayscale(1);opacity:.45}
.star.gold{filter:none;opacity:1}
.lung{width:120px;height:120px;border-radius:50%;background:var(--teal);opacity:.85;transition:transform 4s ease-in-out}
.lungwrap{height:260px;display:grid;place-items:center}
.flash{width:100%;border-radius:var(--r);padding:60px 16px;text-align:center;font-family:var(--display);font-weight:700;font-size:2.4rem;background:var(--good);color:var(--ink)}
.flash.stop{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.stage.enter{animation:none}.bar i{transition:none}.lung{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <div class="head mid" id="head">
    <div class="brand" aria-label="Wobble"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--sun)"/><path d="M7 14c2 9 5 9 6 2 1 7 4 7 6 0 1 7 4 7 6-2" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Wobble</div>
    <span class="who-chip" id="whochip" hidden></span>
  </div>
  <div class="top" id="top" hidden>
    <button class="back" id="back" type="button" aria-label="Back"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="eyebrow center" id="section"></div><span></span>
  </div>
  <div class="bars" id="bars" hidden><div class="bar"><i></i></div><div class="bar"><i></i></div><div class="bar"><i></i></div><div class="bar"><i></i></div></div>
  <main class="stage" id="stage"></main>
</div>
<nav class="tabs" id="tabs" hidden aria-label="Sections"><div>
  <a href="#today">Today</a><a href="#activities">Activities</a><a href="#games">Games</a><a href="#progress">Progress</a>
</div></nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
